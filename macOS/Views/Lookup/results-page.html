<!DOCTYPE html>
<html lang="en">
<head>
		
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Results</title>
		
    <script>
        function element(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function showResults(results) {
            const content = document.createDocumentFragment();
            for (const query of results.queries) {
                if (!results.prettyFormatOutput || query.parsed == null) {
                    const article = element('article');
                    article.append(element('pre', null, query.raw || ''));
                    content.append(article);
                    continue;
                }
                const heading = element('h2', 'input', query.input);
                const controls = element('div');
                const actions = element('div');
                actions.hidden = true;
                const inflections = [];
                if (!results.showInflections) {
                    const toggle = element('button', null, 'Toggle inflections');
                    toggle.addEventListener('click', () => {
                        for (const node of inflections) node.hidden = !node.hidden;
                    });
                    actions.append(toggle);
                }
                const perseus = element('button', null, 'Perseus');
                perseus.addEventListener('click', () => {
                    window.webkit.messageHandlers.perseus.postMessage(query.input);
                });
                actions.append(perseus);
                const more = element('button', 'ellipsis', '⋯');
                more.title = 'Show options';
                more.setAttribute('aria-label', 'Show options');
                more.addEventListener('click', () => { actions.hidden = !actions.hidden; });
                controls.append(actions, more);
                heading.append(controls);
                content.append(heading);
                const body = element('div', 'indented');
                for (const result of query.parsed) {
                    const article = element('article');
                    if (result.word) {
                        article.className = 'word';
                        const word = result.word._0;
                        for (const form of word.forms) {
                            if (form.inflections.length) {
                                const node = element('pre', 'word-inflections', form.inflections.join('\n'));
                                node.hidden = !results.showInflections;
                                inflections.push(node);
                                article.append(node);
                            }
                        }
                        for (const form of word.forms) {
                            if (form.dictionaryForms.length) {
                                article.append(element('pre', 'word-dictionary-forms', form.dictionaryForms.join('\n')));
                            }
                        }
                        article.append(element('p', 'word-meanings', word.meaning));
                    } else {
                        for (const kind of ['addon', 'trick', 'unknown']) {
                            if (result[kind]) article.append(element('pre', kind, result[kind]._0));
                        }
                    }
                    body.append(article);
                }
                content.append(body);
            }
            document.body.replaceChildren(content);
        }
    </script>
	
	<style>
/* 		@media (prefers-color-scheme: dark) {
	  		body   { background:  #333; color: whitesmoke; }
		} */
		
		:root {
			color-scheme: light dark;
		}

        .hidden {
            display: none;
        }

        .indented {
            padding-left: 0.5em;
        }

		body {
			font-size: 0.9rem;
			margin: 0;
			line-height: 110%;
			margin-left: 0.5em;
            margin-top: 0.5em;
			font-family: sans-serif;
            background: -apple-system-text-background;
            color: -apple-system-label;
		}
		
		article {
			margin-top: 0.5em
		}
	
		article:not(:first-child) {
			padding-top: 0.75em;
			margin-top: 0;
		}
		
		article:last-child {
			margin-bottom: 0.75em;
		}
		
		pre.word-dictionary-forms {
			margin-bottom: 0.4em;
			margin-top: 0.2em;
		}
		
		pre.word-inflections {
			color: -apple-system-secondary-label;
		}

        .hidden {
            display: none;
        }

        details > summary {
            cursor: pointer;
            color: -apple-system-tertiary-label;
            font-size: 0.7rem;
            outline: none;
        }
		
		p.word-meanings {
			margin-left: 0.5em;
            font-size: 1.1em;
            line-height: 150%;
		}
	
		pre {
			font-size: 90%;
			font-family: "SF Mono", "monospace";
			margin: 0;
		}
		
		h2.input {
            font-size: 1rem;
            margin-top: 0.4em;
            margin-bottom: 0.5em;

            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: baseline;
		}
		
		h2.input:not(:first-child) {
			border-top: 1px solid -apple-system-separator;
			padding-top: 1em;
		}
		
		p {
			margin: 0
		}

        button {
            background-color: rgba(1,1,1,0);
            margin-right: 0.5em;
            padding: 2px 6px;
            margin-top: 0;
            border: 1px solid -apple-system-secondary-label;
            border-radius: 5pt;
            color: -apple-system-secondary-label;
            font-size: 0.7rem;
        }

        button.ellipsis {
            font-weight: bolder;
            border: 1px solid white;
            /* font-size: 1em; */
        }

        button:hover {
            background-color: -apple-system-tertiary-label;
            border-radius: 5pt;
        }

        button:active {
            background-color: gray;
        }

        @media print {
            button {
                visibility: hidden;
            }
        }
	</style>
</head>
<body>
</body>
</html>
